name: .NET Core CI with SQL Server

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Spins up a local SQL Server container inside the workflow
    services:
      sqlserver:
        image: ://microsoft.com
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourSecurePassword123!" # Match this to your local test connection string if possible
        ports:
          - 1433:1433
        # Wait until SQL Server is healthy before starting the steps
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourSecurePassword123!' -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Update this to match your exact project version (e.g., '6.0.x', '9.0.x')

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --verbosity normal
