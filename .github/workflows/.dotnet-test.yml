name: .NET Core CI / Test Suite

on:
  push:
    branches: [push, pull_request]
  pull_request:
    branches: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the source code from your repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Dynamically set up the .NET SDK environment
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    # Step 3: Clear any local build artifacts and cache to prevent environmental conflicts
    - name: Clean Solution
      run: dotnet clean

    # Step 4: Restore NuGet packages (downloads xUnit, Newtonsoft.Json, Microsoft.AspNetCore.Mvc, etc.)
    - name: Restore Dependencies
      run: dotnet restore

    # Step 5: Build the project in Release configuration without doing another restore step
    - name: Build Application
      run: dotnet build --configuration Release --no-restore

    # Step 6: Execute all xUnit tests (runs store_organiserInfo_test, store_participantInfo_test, etc.)
    - name: Run Test Suite
      run: dotnet test --configuration Release --no-restore --verbosity normal
